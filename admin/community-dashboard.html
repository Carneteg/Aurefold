<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>Aurefold — Community Manager</title>
  <link rel="stylesheet" href="/assets/style.css?v=202608172100" />
  <style>
    .cm-wrap{max-width:1180px;margin:0 auto;padding:2rem 1rem 5rem}.cm-head{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}.cm-head h1{margin:.15rem 0}.cm-actions{display:flex;gap:.55rem;align-items:center;flex-wrap:wrap}.cm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.8rem}.cm-card,.cm-panel{border:1px solid rgba(120,90,65,.35);background:rgba(255,255,255,.025);padding:1rem}.cm-card strong{display:block;font-size:1.8rem;line-height:1.1}.cm-card span{font-size:.84rem;opacity:.78}.cm-panel{margin-top:1rem}.cm-panel h2{margin-top:0}.cm-muted{opacity:.72}.cm-note{font-size:.86rem;opacity:.78}.cm-empty{font-style:italic;opacity:.7}.cm-login{max-width:430px;margin:4rem auto}.cm-table{width:100%;border-collapse:collapse;font-size:.91rem}.cm-table th,.cm-table td{padding:.6rem;border-bottom:1px solid rgba(120,90,65,.22);text-align:left;vertical-align:top}.cm-bar{height:9px;background:rgba(120,90,65,.12);overflow:hidden;border-radius:999px}.cm-bar>span{display:block;height:100%;background:var(--ember,#8a4a2a)}.cm-row{display:grid;grid-template-columns:minmax(130px,1.3fr) 3fr 65px;gap:.65rem;align-items:center;margin:.55rem 0}.cm-funnel-row{display:grid;grid-template-columns:minmax(170px,1fr) 3fr 75px;gap:.7rem;align-items:center;margin:.7rem 0}.cm-badge{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;border:1px solid currentColor;padding:.12rem .4rem;border-radius:2px}.cm-badge-open{color:#4d7a4d}.cm-badge-closed{opacity:.65}.cm-kicker{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;opacity:.72}.cm-insight{padding:.8rem 0;border-top:1px solid rgba(120,90,65,.2)}.cm-insight:first-child{border-top:0}.cm-trend{display:grid;grid-template-columns:110px repeat(4,minmax(54px,1fr));gap:.35rem;align-items:end}.cm-trend-head{font-size:.72rem;opacity:.7;text-align:center}.cm-trend-day{font-size:.78rem;opacity:.75;padding:.3rem 0}.cm-trend-cell{text-align:center;padding:.35rem .2rem;background:rgba(120,90,65,.07);min-height:2rem}.cm-window button[aria-pressed="true"]{background:var(--ember);color:var(--bg)}.cm-status{min-height:1.3rem}.cm-spacer{height:.5rem}@media(max-width:680px){.cm-row,.cm-funnel-row{grid-template-columns:1fr}.cm-trend{grid-template-columns:82px repeat(4,minmax(42px,1fr));font-size:.78rem}}
  </style>
</head>
<body>
  <main class="cm-wrap" id="cm-root"></main>
  <script src="/data/community.js?v=202608190540"></script>
  <script src="/assets/community-dashboard.js?v=202608190555"></script>
</body>
</html>
