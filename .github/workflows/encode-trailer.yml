name: Encode trailer for the web

# Runs on GitHub's infrastructure, which can reach Drive and has ffmpeg.
# Downloads the master trailer, encodes a web-sized MP4 plus a poster frame,
# and commits both. Delete this workflow once the trailer is settled.
on:
  push:
    branches:
      - agent/trailer-encode
  workflow_dispatch:

permissions:
  contents: write

jobs:
  encode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the master trailer from Drive
        shell: bash
        run: |
          set -euo pipefail
          ID=1kzuiCWkHGkpO3zUkaML2kIMlZKwDpbbB
          curl -L --fail --silent --show-error \
            "https://drive.usercontent.google.com/download?id=$ID&export=download&confirm=t" \
            -o master.mp4
          echo "downloaded $(wc -c < master.mp4) bytes"
          # Drive serves an HTML page instead of the file when it is not link-shared
          if head -c 200 master.mp4 | grep -qi '<!doctype html\|<html'; then
            echo "::error::Drive returned an HTML page, not the video. The file is not link-shared."
            head -c 400 master.mp4
            exit 1
          fi
          ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height,codec_name \
            -of default=noprint_wrappers=1 master.mp4

      - name: Encode a web-sized MP4 and a poster frame
        shell: bash
        run: |
          set -euo pipefail
          DUR=$(ffprobe -v error -show_entries format=duration -of csv=p=0 master.mp4 | cut -d. -f1)
          echo "duration: ${DUR}s"

          # Aim for roughly a 15 MB file: total kbit budget / duration, minus audio.
          TARGET_MB=15
          TOTAL_KBIT=$(( TARGET_MB * 8 * 1024 ))
          VB=$(( TOTAL_KBIT / DUR - 128 ))
          # keep it sane regardless of length
          if [ "$VB" -lt 700 ]; then VB=700; fi
          if [ "$VB" -gt 4000 ]; then VB=4000; fi
          echo "video bitrate: ${VB}k"

          # Two passes so the size lands close to the target. Cap height at 1080.
          # +faststart moves the index to the front so it streams instead of
          # having to download fully before playing.
          ffmpeg -y -i master.mp4 -vf "scale=-2:'min(1080,ih)'" \
            -c:v libx264 -b:v "${VB}k" -preset slow -pass 1 -an -f mp4 /dev/null
          ffmpeg -y -i master.mp4 -vf "scale=-2:'min(1080,ih)'" \
            -c:v libx264 -b:v "${VB}k" -preset slow -pass 2 \
            -c:a aac -b:a 128k -movflags +faststart \
            assets/aurefold-trailer.mp4

          # Poster frame from a tenth of the way in, so it is not a black fade-up.
          POS=$(( DUR / 10 )); [ "$POS" -lt 1 ] && POS=1
          ffmpeg -y -ss "$POS" -i master.mp4 -frames:v 1 \
            -vf "scale=-2:'min(1080,ih)'" -q:v 3 assets/aurefold-trailer-poster.jpg

          ls -la assets/aurefold-trailer.*
          SIZE=$(wc -c < assets/aurefold-trailer.mp4)
          echo "encoded size: $(( SIZE / 1048576 )) MB"
          if [ "$SIZE" -gt 94371840 ]; then
            echo "::error::Encoded file is still over 90 MB — refusing to commit."
            exit 1
          fi

      - name: Commit the web assets
        shell: bash
        run: |
          set -euo pipefail
          rm -f master.mp4 ffmpeg2pass-*.log*
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/aurefold-trailer.mp4 assets/aurefold-trailer-poster.jpg
          git commit -m "Add web-encoded trailer and poster frame"
          git push
