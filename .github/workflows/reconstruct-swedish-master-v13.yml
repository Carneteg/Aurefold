name: Reconstruct Swedish Master v1.3

on:
  push:
    branches:
      - agent/book1-swedish-master-v13
    paths:
      - '.github/workflows/reconstruct-swedish-master-v13.yml'
      - '.translation-build/sv-v1.3/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/book1-swedish-master-v13
          fetch-depth: 0

      - name: Reconstruct candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p manuscript/book-one/sv validation
          cat \
            .translation-build/sv-v1.3/part_00.b64 \
            .translation-build/sv-v1.3/part_01_02.b64 \
            .translation-build/sv-v1.3/part_03_04.b64 \
            .translation-build/sv-v1.3/part_05_06.b64 \
            .translation-build/sv-v1.3/part_07_08.b64 \
            .translation-build/sv-v1.3/part_09_10.b64 \
            .translation-build/sv-v1.3/part_11_12.b64 \
            .translation-build/sv-v1.3/part_13_14.b64 \
            > /tmp/aurefold_sv_v13.b64
          base64 --decode /tmp/aurefold_sv_v13.b64 > /tmp/aurefold_sv_v13.xz
          xz --test /tmp/aurefold_sv_v13.xz
          xz --decompress --stdout /tmp/aurefold_sv_v13.xz > manuscript/book-one/sv/Aurefold_Tystnadens_Klocka_Swedish_Master_v1.3.md

      - name: Validate structure and write report
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, re, sys

          p = Path('manuscript/book-one/sv/Aurefold_Tystnadens_Klocka_Swedish_Master_v1.3.md')
          text = p.read_text(encoding='utf-8')
          lines = text.splitlines()
          sha = hashlib.sha256(p.read_bytes()).hexdigest()
          words = len(re.findall(r"\b[\wÅÄÖåäöÉéÀ-ÿ’'-]+\b", text, flags=re.UNICODE))
          h1 = [x for x in lines if x.startswith('# ')]
          h2 = [x for x in lines if x.startswith('## ')]
          chapter_headers = [x for x in lines if re.match(r'^# Kapitel\b', x, flags=re.I)]
          english_chapter_headers = [x for x in lines if re.match(r'^#{1,3}\s+(Chapter|Interlude)\b', x)]
          english_markers = re.findall(r'\b(the|and|with|from|that|this|was|were|said|asked|looked|would|could|should)\b', text, flags=re.I)
          replacement_markers = [m for m in ['EMBERWOLD','Emberwold','EMBERWORLD','Emberworld'] if m in text]

          protected = {
            'Aurefold present': 'Aurefold' in text,
            'Sela present': 'Sela' in text,
            'Harl present': 'Harl' in text,
            'Liggaren present': 'Liggaren' in text,
            'Inte jag present': ('Inte jag' in text or 'Icke jag' in text),
          }

          report = {
            'file': str(p),
            'sha256': sha,
            'bytes': p.stat().st_size,
            'word_count_regex': words,
            'h1_count': len(h1),
            'h2_count': len(h2),
            'chapter_header_count': len(chapter_headers),
            'english_chapter_headers': english_chapter_headers,
            'common_english_marker_count': len(english_markers),
            'superseded_world_name_markers': replacement_markers,
            'protected_marker_checks': protected,
            'first_12_lines': lines[:12],
            'last_12_lines': lines[-12:],
          }

          Path('validation/Aurefold_Tystnadens_Klocka_Swedish_Master_v1.3_validation.json').write_text(
            json.dumps(report, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          print(json.dumps(report, ensure_ascii=False, indent=2))

          if p.stat().st_size < 400_000:
              raise SystemExit('FAIL: reconstructed manuscript is unexpectedly small')
          if len(chapter_headers) < 47:
              raise SystemExit(f'FAIL: only {len(chapter_headers)} Swedish chapter headers found')
          if english_chapter_headers:
              raise SystemExit('FAIL: English chapter/interlude headings remain')
          if replacement_markers:
              raise SystemExit('FAIL: superseded Emberworld/Emberwold world-name markers remain')

      - name: Commit reconstructed master and validation report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Aurefold Build Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add manuscript/book-one/sv/Aurefold_Tystnadens_Klocka_Swedish_Master_v1.3.md \
                  validation/Aurefold_Tystnadens_Klocka_Swedish_Master_v1.3_validation.json
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'build Swedish Master v1.3 candidate'
          git push origin HEAD:agent/book1-swedish-master-v13
