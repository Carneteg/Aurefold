name: Recover Swedish Master v1.3

on:
  push:
    branches:
      - agent/book1-swedish-master-v13
    paths:
      - '.github/workflows/reconstruct-swedish-master-v13.yml'
      - '.translation-build/sv-v1.3/**'
  pull_request:
    branches:
      - agent/book1-v17-master-mirror
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/book1-swedish-master-v13
          fetch-depth: 0

      - name: Recover translated prefix
        shell: bash
        run: |
          set -u
          mkdir -p manuscript/book-one/sv validation
          cat \
            .translation-build/sv-v1.3/part_00.b64 \
            .translation-build/sv-v1.3/part_01_02.b64 \
            .translation-build/sv-v1.3/part_03_04.b64 \
            .translation-build/sv-v1.3/part_05_06.b64 \
            .translation-build/sv-v1.3/part_07_08.b64 \
            .translation-build/sv-v1.3/part_09_10.b64 \
            .translation-build/sv-v1.3/part_11_12.b64 \
            .translation-build/sv-v1.3/part_13_14.b64 \
            > /tmp/aurefold_sv_v13.b64
          base64 --decode /tmp/aurefold_sv_v13.b64 > /tmp/aurefold_sv_v13.xz
          xz --decompress --stdout /tmp/aurefold_sv_v13.xz > manuscript/book-one/sv/Aurefold_Tystnadens_Klocka_Swedish_Master_v1.3_RECOVERED_PREFIX.md || true
          test -s manuscript/book-one/sv/Aurefold_Tystnadens_Klocka_Swedish_Master_v1.3_RECOVERED_PREFIX.md

      - name: Inspect recovered prefix
        shell: python
        run: |
          from pathlib import Path
          import hashlib, json, re
          p = Path('manuscript/book-one/sv/Aurefold_Tystnadens_Klocka_Swedish_Master_v1.3_RECOVERED_PREFIX.md')
          text = p.read_text(encoding='utf-8', errors='replace')
          lines = text.splitlines()
          headings = [(i+1,l) for i,l in enumerate(lines) if l.startswith('#')]
          chapters = [(i,l) for i,l in headings if re.match(r'^# Kapitel\b', l, re.I)]
          report = {
            'bytes': p.stat().st_size,
            'sha256': hashlib.sha256(p.read_bytes()).hexdigest(),
            'word_count_regex': len(re.findall(r"\b[\wÅÄÖåäöÉéÀ-ÿ’'-]+\b", text, re.UNICODE)),
            'chapter_header_count': len(chapters),
            'last_chapter_headers': chapters[-8:],
            'last_30_lines': lines[-30:],
            'contains_emberworld': bool(re.search(r'Emberw(?:orld|old)', text, re.I)),
          }
          Path('validation/Aurefold_Tystnadens_Klocka_RECOVERED_PREFIX_report.json').write_text(json.dumps(report, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          print(json.dumps(report, ensure_ascii=False, indent=2))

      - name: Commit recovered prefix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Aurefold Build Agent'
          git config user.email 'actions@users.noreply.github.com'
          git add manuscript/book-one/sv/Aurefold_Tystnadens_Klocka_Swedish_Master_v1.3_RECOVERED_PREFIX.md \
                  validation/Aurefold_Tystnadens_Klocka_RECOVERED_PREFIX_report.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'recover Swedish translation prefix'
          git push origin HEAD:agent/book1-swedish-master-v13
