name: Deploy site to GitHub Pages

on:
  push:
    branches: ["claude/interactive-house-map-rzboaq"]
  workflow_dispatch:

# Let the workflow enable Pages, mint the deploy token, and publish.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Assemble the static site (promo pages only, not the MediaWiki folder)
        run: |
          mkdir _site
          cp ./*.html _site/
          cp -r assets data _site/
          touch _site/.nojekyll

      - name: Configure Pages (enables it on first run)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
