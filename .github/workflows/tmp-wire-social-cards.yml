name: Wire Sela share cards into metadata

on:
  push:
    branches: [agent/social-share-cards-sela]
    paths: [.github/workflows/tmp-wire-social-cards.yml]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/social-share-cards-sela
      - name: Update Open Graph and Twitter image metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          home = [Path('index.html')] + [Path(x)/'index.html' for x in ['sv','es','fr','zh','ja']]
          book = [Path('book.html')] + [Path(x)/'book.html' for x in ['sv','es','fr','zh','ja']]

          def patch(path, url, alt):
              s = path.read_text(encoding='utf-8')
              s = re.sub(r'(<meta\s+property="og:image"\s+content=")[^"]+("\s*/?>)', rf'\1{url}\2', s)
              s = re.sub(r'(<meta\s+name="twitter:image"\s+content=")[^"]+("\s*/?>)', rf'\1{url}\2', s)
              s = re.sub(r'(<meta\s+property="og:image:alt"\s+content=")[^"]+("\s*/?>)', rf'\1{alt}\2', s)
              s = re.sub(r'(<meta\s+name="twitter:image:alt"\s+content=")[^"]+("\s*/?>)', rf'\1{alt}\2', s)
              path.write_text(s, encoding='utf-8')

          for p in home:
              patch(p, 'https://aurefold.com/assets/social/og-aurefold-sela.jpg', 'AUREFOLD — Sela of the Light Heights')
          for p in book:
              patch(p, 'https://aurefold.com/assets/social/og-bell-of-silence-sela.jpg', 'The Bell of Silence — Book One of Aurefold, featuring Sela')
          PY
      - name: Commit metadata and remove temporary workflow
        run: |
          rm .github/workflows/tmp-wire-social-cards.yml
          git config user.name 'Aurefold Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html book.html sv/index.html sv/book.html es/index.html es/book.html fr/index.html fr/book.html zh/index.html zh/book.html ja/index.html ja/book.html .github/workflows/tmp-wire-social-cards.yml
          git commit -m 'Use Sela social cards across homepage and Book One metadata'
          git push origin HEAD:agent/social-share-cards-sela
