name: Manuscript & Canon Infrastructure Tests

on:
  pull_request:
    paths:
      - "tools/manuscript_sync.py"
      - "tests/test_manuscript_sync.py"
      - "tests/test_security_hardening.py"
      - "tests/test_release_readiness.py"
      - "tests/test_scene_scorecard_batch.py"
      - "tests/test_scene_scorecard_batch_ch01_06.py"
      - "tests/test_scene_scorecard_batch_ch07_12.py"
      - "tests/test_scene_scorecard_batch_ch13_18.py"
      - "assets/manuscript-sync.js"
      - "assets/canon-validator.js"
      - "assets/editorial-issues.js"
      - "assets/scene-scorecards.js"
      - "assets/character-arcs.js"
      - "assets/knowledge-graph.js"
      - "assets/provenance-evidence.js"
      - "assets/mystery-protection.js"
      - "assets/dependency-impact.js"
      - "assets/timeline-engine.js"
      - "assets/spatial-continuity.js"
      - "assets/material-continuity.js"
      - "assets/security-hardening.js"
      - "assets/release-readiness.js"
      - "admin/loremaster.html"
      - "admin/character-arcs.html"
      - "admin/knowledge-graph.html"
      - "admin/provenance-evidence.html"
      - "admin/mystery-protection.html"
      - "admin/dependency-impact.html"
      - "admin/timeline.html"
      - "admin/spatial-continuity.html"
      - "admin/material-continuity.html"
      - "admin/security-hardening.html"
      - "admin/release-readiness.html"
      - "supabase/migrations/**"
      - ".github/workflows/manuscript-sync-tests.yml"
  push:
    paths:
      - "tools/manuscript_sync.py"
      - "tests/test_manuscript_sync.py"
      - "tests/test_security_hardening.py"
      - "tests/test_release_readiness.py"
      - "tests/test_scene_scorecard_batch.py"
      - "tests/test_scene_scorecard_batch_ch01_06.py"
      - "tests/test_scene_scorecard_batch_ch07_12.py"
      - "tests/test_scene_scorecard_batch_ch13_18.py"
      - "assets/manuscript-sync.js"
      - "assets/canon-validator.js"
      - "assets/editorial-issues.js"
      - "assets/scene-scorecards.js"
      - "assets/character-arcs.js"
      - "assets/knowledge-graph.js"
      - "assets/provenance-evidence.js"
      - "assets/mystery-protection.js"
      - "assets/dependency-impact.js"
      - "assets/timeline-engine.js"
      - "assets/spatial-continuity.js"
      - "assets/material-continuity.js"
      - "assets/security-hardening.js"
      - "assets/release-readiness.js"
      - "admin/loremaster.html"
      - "admin/character-arcs.html"
      - "admin/knowledge-graph.html"
      - "admin/provenance-evidence.html"
      - "admin/mystery-protection.html"
      - "admin/dependency-impact.html"
      - "admin/timeline.html"
      - "admin/spatial-continuity.html"
      - "admin/material-continuity.html"
      - "admin/security-hardening.html"
      - "admin/release-readiness.html"
      - "supabase/migrations/**"
      - ".github/workflows/manuscript-sync-tests.yml"

jobs:
  parser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run stdlib manuscript sync tests
        run: python -m unittest tests/test_manuscript_sync.py
      - name: Run security hardening regression tests
        run: python -m unittest tests/test_security_hardening.py
      - name: Run Release Readiness regression tests
        run: python -m unittest tests/test_release_readiness.py
      - name: Run Scene Scorecard batch contract tests
        run: python -m unittest tests/test_scene_scorecard_batch.py
      - name: Run Chapters 1-6 Scene Scorecard contract tests
        run: python -m unittest tests/test_scene_scorecard_batch_ch01_06.py
      - name: Run Chapters 7-12 Scene Scorecard contract tests
        run: python -m unittest tests/test_scene_scorecard_batch_ch07_12.py
      - name: Run Chapters 13-18 Scene Scorecard contract tests
        run: python -m unittest tests/test_scene_scorecard_batch_ch13_18.py
      - name: Syntax-check browser sync client
        run: node --check assets/manuscript-sync.js
      - name: Syntax-check Canon Validator client
        run: node --check assets/canon-validator.js
      - name: Syntax-check Editorial Issues client
        run: node --check assets/editorial-issues.js
      - name: Syntax-check Scene Scorecards client
        run: node --check assets/scene-scorecards.js
      - name: Syntax-check Character Arc Graph client
        run: node --check assets/character-arcs.js
      - name: Syntax-check Knowledge Graph client
        run: node --check assets/knowledge-graph.js
      - name: Syntax-check Provenance client
        run: node --check assets/provenance-evidence.js
      - name: Syntax-check Mystery Protection client
        run: node --check assets/mystery-protection.js
      - name: Syntax-check Dependency Impact client
        run: node --check assets/dependency-impact.js
      - name: Syntax-check Timeline Engine client
        run: node --check assets/timeline-engine.js
      - name: Syntax-check Spatial Continuity client
        run: node --check assets/spatial-continuity.js
      - name: Syntax-check Material Continuity client
        run: node --check assets/material-continuity.js
      - name: Syntax-check Security Hardening client
        run: node --check assets/security-hardening.js
      - name: Syntax-check Release Readiness client
        run: node --check assets/release-readiness.js
