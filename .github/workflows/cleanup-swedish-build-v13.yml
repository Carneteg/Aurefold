name: Cleanup Swedish Master v1.3 build scratch

on:
  push:
    branches:
      - agent/book1-swedish-master-v13
    paths:
      - '.github/workflows/cleanup-swedish-build-v13.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/book1-swedish-master-v13
          fetch-depth: 0

      - name: Remove only Swedish v1.3 build scratch introduced on this branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/book1-v17-master-mirror
          while IFS= read -r f; do
            case "$f" in
              .translation-build/*|\
              manuscript/book-one/sv/Aurefold_Tystnadens_Klocka_Swedish_Master_v1.3_RECOVERED_PREFIX.md|\
              validation/Aurefold_Tystnadens_Klocka_RECOVERED_PREFIX_report.json|\
              .github/workflows/assemble-swedish-master-v13.yml|\
              .github/workflows/print-book1-v17-section-index.yml|\
              .github/workflows/*swedish*master*v13*.yml|\
              .github/workflows/*swedish*v13*.yml)
                if [ -e "$f" ]; then git rm -rf -- "$f"; fi
                ;;
            esac
          done < <(git diff --name-only origin/agent/book1-v17-master-mirror...HEAD)

          # Delete this one-shot workflow from the resulting branch as well.
          git rm -f .github/workflows/cleanup-swedish-build-v13.yml

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Aurefold Build Agent'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No cleanup changes.'
          else
            git commit -m 'clean Swedish Master v1.3 build scratch'
            git pull --rebase origin agent/book1-swedish-master-v13
            git push origin HEAD:agent/book1-swedish-master-v13
          fi
