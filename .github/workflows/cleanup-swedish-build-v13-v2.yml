name: Cleanup Swedish Master v1.3 build scratch v2

on:
  push:
    branches:
      - agent/book1-swedish-master-v13
    paths:
      - '.github/workflows/cleanup-swedish-build-v13-v2.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/book1-swedish-master-v13
          fetch-depth: 0

      - name: Remove branch-local Swedish build scratch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin agent/book1-v17-master-mirror
          mapfile -t changed < <(git diff --name-only origin/agent/book1-v17-master-mirror...HEAD)
          for f in "${changed[@]}"; do
            case "$f" in
              .translation-build/*|\
              manuscript/book-one/sv/Aurefold_Tystnadens_Klocka_Swedish_Master_v1.3_RECOVERED_PREFIX.md|\
              validation/Aurefold_Tystnadens_Klocka_RECOVERED_PREFIX_report.json|\
              .github/workflows/assemble-swedish-master-v13.yml|\
              .github/workflows/print-book1-v17-section-index.yml|\
              .github/workflows/recover-swedish-master-v13.yml|\
              .github/workflows/reconstruct-swedish-master-v13.yml|\
              .github/workflows/cleanup-swedish-build-v13.yml)
                if [ -e "$f" ] || git ls-files --error-unmatch "$f" >/dev/null 2>&1; then
                  git rm -rf --ignore-unmatch -- "$f"
                fi
                ;;
            esac
          done
          git rm -f --ignore-unmatch .github/workflows/cleanup-swedish-build-v13-v2.yml

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Aurefold Build Agent'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No cleanup changes.'
          else
            git commit -m 'clean Swedish Master v1.3 build scratch'
            git pull --rebase origin agent/book1-swedish-master-v13
            git push origin HEAD:agent/book1-swedish-master-v13
          fi
