# AUREFOLD wiki — MediaWiki LTS + MariaDB
# First run: docker compose up -d  →  http://localhost:8080  →  run the install wizard
# (see README.md for the full walkthrough)
services:
  mediawiki:
    image: mediawiki:lts
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - wiki_images:/var/www/html/images
      # After the install wizard, save LocalSettings.php into ./config/ and
      # uncomment the next two lines, then: docker compose restart mediawiki
      # - ./config/LocalSettings.php:/var/www/html/LocalSettings.php
      # - ./config/LocalSettings.aurefold.php:/var/www/html/LocalSettings.aurefold.php
      # - ./config/aurefold_logo.png:/var/www/html/resources/assets/aurefold_logo.png
      # - ./extensions-extra/TemplateStyles:/var/www/html/extensions/TemplateStyles
      # - ./extensions-extra/Popups:/var/www/html/extensions/Popups
      - ./content:/opt/aurefold/content:ro
      - ./images:/opt/aurefold/images:ro
    depends_on:
      - database

  database:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: aurefold_wiki
      MYSQL_USER: wikiuser
      MYSQL_PASSWORD: change-me-wiki-password
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - wiki_db:/var/lib/mysql

volumes:
  wiki_images:
  wiki_db:
